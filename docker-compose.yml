services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_ERROR_THRESHOLD: ${ALERT_ERROR_THRESHOLD:-50}
      ALERT_WINDOW_MINUTES: ${ALERT_WINDOW_MINUTES:-5}
      ALERT_CHECK_INTERVAL_MINUTES: ${ALERT_CHECK_INTERVAL_MINUTES:-1}
      COMPRESSION_ENABLED: ${COMPRESSION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-logs}"]
      interval: 5s
      timeout: 5s
      retries: 10
