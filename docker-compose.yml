services:

  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logs
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logs
    ports:
      - "5432:5432"
    cpus: 1
    mem_limit: 1g
    command: >
      postgres
      -c synchronous_commit=off
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=1GB
      -c shared_buffers=256MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
